# If this file is renamed, the incrementing run number will be reset. If the workflow's
# `name` changes, the `workflow_run` trigger in publish.yml must be updated.

name: CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

env:
  CI_BUILD_NUMBER_BASE: ${{ github.run_number }}
  CI_TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
  CI_PUBLISH: ${{ (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev'))}}

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    permissions:
      # Required for creating GitHub releases.
      contents: write

    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build and Publish
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          ./build/Build.Windows.ps1
      - name: Upload packages
        # Consumed by the publish-nuget job in publish.yml
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 1
      - name: Upload archives
        # Consumed by the publish-npm job in publish.yml
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: archives
          path: |
            artifacts/seqcli-*-*.zip
            artifacts/seqcli-*-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - name: Setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Configure Docker
        run: |
          docker run --privileged --rm linuxkit/binfmt:bebbae0c1100ebf7bf2ad4dfb9dfd719cf0ef132
          sudo service docker restart
      - name: Build and Publish
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: true
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          SEQ_DOCKER_TAG: 2026.1
        shell: pwsh
        run: |
          ./build/Build.Linux.ps1 -SeqDockerTag $env:SEQ_DOCKER_TAG
