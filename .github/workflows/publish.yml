# Publishes the packages built by a successful CI run: creates a draft GitHub release, pushes the
# packages to NuGet.org and npm and the Docker images to Docker Hub, then publishes the release once
# all three registries have succeeded.

name: Publish

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ "dev", "main" ]

permissions: {}

env:
  # Reproduce the version computed by the triggering CI run (see Get-SemVer in build/Build.Common.ps1).
  CI_BUILD_NUMBER_BASE: ${{ github.event.workflow_run.run_number }}
  CI_TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}

jobs:
  draft-release:
    name: Draft GitHub release
    runs-on: ubuntu-24.04

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))

    permissions:
      # Required to download artifacts from the triggering CI run.
      actions: read
      # Required to create the release.
      contents: write

    outputs:
      tag: ${{ steps.draft.outputs.tag }}

    steps:
      # Build.Common.ps1 and baseversion, at the commit CI built, to reproduce its version.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Download release assets
        # Every artifact of the CI run: `packages`, `archives` and `docs`.
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Create draft release
        # Writes the release tag to the step's `tag` output.
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: pwsh
        run: |
          ./build/Build.Release.ps1 -AssetDir ./release-assets -Target $env:HEAD_SHA

  publish-nuget:
    name: Publish (NuGet)
    runs-on: ubuntu-24.04

    needs: draft-release

    permissions:
      # Required to download artifacts from the triggering CI run.
      actions: read
      # Required for NuGet.org trusted publishing.
      id-token: write

    steps:
      - name: Setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Log in to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to NuGet
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: true
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem ./packages/*.nupkg)
          if ($packages.Count -eq 0) { throw "No packages found in ./packages" }
          foreach ($nupkg in $packages) {
            dotnet nuget push "$nupkg" --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Publishing failed" }
          }

  publish-npm:
    name: Publish (npm)
    runs-on: ubuntu-24.04

    needs: draft-release

    permissions:
      # Required to download artifacts from the triggering CI run.
      actions: read
      contents: read
      # Required for npm trusted publishing and provenance.
      id-token: write

    steps:
      # Build.Npm.ps1 and the package templates under ./npm, at the commit CI built. The checks on
      # the draft-release job guarantee this is a commit pushed to this repository, not pull request code.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Setup
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Update npm
        # Trusted publishing and automatic provenance require npm 11.5.1 or later
        run: |
          npm install -g npm@latest
          npm --version
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          name: archives
          path: npm-archives
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish
        shell: pwsh
        run: |
          ./build/Build.Npm.ps1 -ArchiveDir ./npm-archives

  publish-docker:
    name: Publish (Docker)
    runs-on: ubuntu-24.04

    needs: draft-release

    permissions:
      contents: read

    steps:
      # Build.Docker.ps1, the Dockerfiles and the source, at the commit CI built and tested. The checks
      # on the draft-release job guarantee this is a commit pushed to this repository, not pull request code.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Configure Docker
        # Enables building the arm64 image on the x64 runner.
        run: |
          docker run --privileged --rm linuxkit/binfmt:bebbae0c1100ebf7bf2ad4dfb9dfd719cf0ef132
          sudo service docker restart
      - name: Build and Publish
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: true
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        shell: pwsh
        run: |
          ./build/Build.Docker.ps1

  publish-github:
    name: Publish GitHub release
    runs-on: ubuntu-24.04

    # Only publish the release once the packages are on NuGet.org, npm and Docker Hub.
    needs: [ draft-release, publish-nuget, publish-npm, publish-docker ]

    permissions:
      # Required to publish the release and create its tag.
      contents: write

    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft-release.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
